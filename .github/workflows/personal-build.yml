name: Personal build
on:
  workflow_dispatch:
  push:
    branches: [herrsch]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install verified Zig 0.16.0
        shell: python
        run: |
          import hashlib,json,os,platform,tarfile,urllib.request,zipfile
          from pathlib import Path
          system={'Darwin':'macos','Linux':'linux','Windows':'windows'}[platform.system()]
          arch='aarch64' if platform.machine().lower() in ('arm64','aarch64') else 'x86_64'
          release=json.load(urllib.request.urlopen('https://ziglang.org/download/index.json'))['0.16.0'][arch+'-'+system]
          path=Path(os.environ['RUNNER_TEMP']) / Path(release['tarball']).name
          urllib.request.urlretrieve(release['tarball'],path)
          assert hashlib.sha256(path.read_bytes()).hexdigest()==release['shasum']
          out=Path(os.environ['RUNNER_TEMP'])/'herdr-zig';out.mkdir(exist_ok=True)
          if path.suffix=='.zip':
              with zipfile.ZipFile(path) as archive: archive.extractall(out)
          else:
              with tarfile.open(path) as archive: archive.extractall(out,filter='data')
          directory=next(out.iterdir())
          with open(os.environ['GITHUB_PATH'],'a') as file:file.write(str(directory)+'\n')
      - name: Python tests
        shell: bash
        run: |
          python -m pip install -r personal/schedules/requirements.txt
          python -m unittest discover -s personal/tests -v
          python -m unittest discover -s personal/schedules/tests -v
      - name: Build macOS or Linux
        if: runner.os != 'Windows'
        run: cargo build --release --locked
      - name: Build Windows with ConPTY runtime
        if: runner.os == 'Windows'
        run: python scripts/package_windows_conpty.py build-local
      - uses: actions/upload-artifact@v4
        with:
          name: herdr-personal-${{ matrix.os }}
          path: |
            target/release/herdr
            target/release/herdr.exe
            target/release/conpty/
